<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">X-hale screenshot placeholders</title>
  <desc id="desc">Three empty panels reserved for real screenshots. No application interfaces are shown.</desc>
  <rect width="960" height="390" rx="12" fill="#f6f8fa"/>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="7 6"><rect x="24" y="24" width="288" height="300" rx="12"/><rect x="336" y="24" width="288" height="300" rx="12"/><rect x="648" y="24" width="288" height="300" rx="12"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#24292f">
    <g font-size="21"><text x="168" y="146">Progress dashboard</text><text x="480" y="146">Hailey conversation</text><text x="792" y="146">Coping tools</text></g>
    <g font-size="16" fill="#57606a"><text x="168" y="184">Screenshot to be added</text><text x="480" y="184">Screenshot to be added</text><text x="792" y="184">Screenshot to be added</text></g>
    <text x="480" y="362" font-size="16">PLACEHOLDERS ONLY — real application captures will replace these panels</text>
  </g>
</svg>
