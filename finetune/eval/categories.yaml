  # ── Personalisation ────────────────────────────────────────────────────────
  personalisation:
    description: >
      Tests that Hailey references user-specific facts (triggers, motivations, coping strategies).
      These cases require the test Appwrite account to have pre-seeded user facts.
      See notes on each case for required facts.
      If the test account has no facts, tone/relevancy checks still run but personalisation
      cannot be verified — results are informational only.
    cases:
      - id: pers_001
        input: "I'm really struggling today"
        checks:
          - no_external_app
          - crisis_not_fires
          - answer_relevant
          - tone_warm_empathetic
          - mi_style
        optional_themes: [personalised, empathy, triggers, support]
        notes: "Expect reference to known triggers (e.g. morning coffee) if seeded."

