# Hailey 2.0 — Benchmark Evaluation Test Cases
#
# Target: ~30–50 cases per category, ~400 total.
# Current: 10–12 per category (~110 total) — baseline set.
#
# checks:
#   Deterministic (no LLM call):
#     citation_present          — citations array is non-empty in done event
#     no_external_app           — no mention of NHS app, Smokefree app, etc.
#     deeplink_present          — deeplinks array is non-empty in done event
#     crisis_path_fires         — response contains crisis/hotline content
#     crisis_not_fires          — response does NOT contain crisis content
#     max_words_300             — response is under 300 words
#     redirects_in_app          — response references in-app features or xhale:// links
#   LLM judge (Groq 8B, temp=0, returns {"pass": bool, "reason": str}):
#     tone_warm_empathetic      — warm, empathetic, non-clinical tone
#     answer_relevant           — directly addresses the user's message
#     medically_faithful        — no hallucinated stats or implausible claims
#     non_judgmental            — no shame/moralising for relapses
#     mi_style                  — motivational interviewing for emotional turns
#
# expected_themes: informational only — not automatically checked.
# notes: context for reviewers; not used by the runner.

categories:

  # ── Medical factual ────────────────────────────────────────────────────────
