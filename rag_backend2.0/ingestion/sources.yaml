# Curated knowledge base source manifest for Hailey 2.0
# Each entry defines a source that has been (or should be) ingested into Qdrant.
# Run `python -m ingestion.ingest_kb --url <url> --source-id <id> --source-type <type>`
# to ingest a new source.
#
# Fields:
#   source_id:    unique identifier (snake_case)
#   url:          canonical URL of the source
#   source_type:  government | peer_reviewed | charity | web
#   topic_tags:   list of relevant topic tags
#   benefit_ids:  list of health benefit IDs this source covers (optional)
#   recency_date: publication or last-review date (YYYY-MM-DD)
#   ingested:     true if currently in Qdrant

sources:
