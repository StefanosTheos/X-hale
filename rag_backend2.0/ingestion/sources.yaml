    url: https://www.cdc.gov/tobacco/quit_smoking/how_to_quit/benefits/index.htm
    source_type: government
    topic_tags: [health_benefits, quit_timeline, withdrawal]
    benefit_ids: [20min, 72hr, 10yr]
    recency_date: "2024-01-01"
    ingested: true

