# Curated knowledge base source manifest for Hailey 2.0
# Each entry defines a source that has been (or should be) ingested into Qdrant.
# Run `python -m ingestion.bulk_ingest` to ingest all pending sources, or:
#   python -m ingestion.ingest_kb --url <url> --source-id <id> --source-type <type>
#
# Fields:
#   source_id:    unique identifier (snake_case)
#   url:          canonical URL of the source
#   source_type:  government | peer_reviewed | charity | web
#   topic_tags:   list of relevant topic tags
#   benefit_ids:  list of health benefit IDs this source covers (optional)
#   recency_date: publication or last-review date (YYYY-MM-DD)
#   ingested:     true if currently in Qdrant
#   governance:   developer review, provenance, access, and review status

# Git preserves when an ingested manifest was committed, but the original
# HTTP fetches were not timestamped or archived. These profiles therefore use
# an ingestion-evidence date and explicitly leave the exact fetch date and
# content hash unavailable rather than reconstructing them retrospectively.
governance_profiles:
  initial_corpus: &initial_corpus_governance
    fetch_date: null
    fetch_date_status: unavailable
    ingestion_evidence_date: "2026-05-27"
    developer_review_date: "2026-05-27"
    reviewer_name: Stefanos Theos
    reviewer_role: application developer and source curator
    review_scope: relevance, publisher authority, scientific support, and consistency screening
    authority_rationale: trusted public-health, clinical, governmental, or nonprofit publisher relevant to smoking cessation
    access_status: publicly_accessible
    licensing_status: reuse_license_and_permission_not_independently_verified
    content_version: unavailable
    content_sha256: unavailable
    inclusion_decision: included_after_developer_review
    independent_content_review: pending
    next_scheduled_review: "2026-11-27"
  expanded_corpus: &expanded_corpus_governance
    fetch_date: null
    fetch_date_status: unavailable
    ingestion_evidence_date: "2026-06-12"
    developer_review_date: "2026-06-12"
    reviewer_name: Stefanos Theos
    reviewer_role: application developer and source curator
    review_scope: relevance, publisher authority, scientific support, and consistency screening
    authority_rationale: trusted public-health, clinical, governmental, or nonprofit publisher relevant to smoking cessation
    access_status: publicly_accessible
    licensing_status: reuse_license_and_permission_not_independently_verified
    content_version: unavailable
    content_sha256: unavailable
    inclusion_decision: included_after_developer_review
    independent_content_review: pending
    next_scheduled_review: "2026-12-12"
  targeted_corpus: &targeted_corpus_governance
    fetch_date: "2026-08-23"
    fetch_date_status: verified_during_developer_review
    ingestion_evidence_date: "2026-08-23"
    developer_review_date: "2026-08-23"
    reviewer_name: Stefanos Theos
    reviewer_role: application developer and source curator
    review_scope: recurring benchmark coverage, publisher authority, scientific support, and consistency screening
    authority_rationale: official CDC, NHS, or United States National Cancer Institute smoking-cessation guidance
    access_status: publicly_accessible
    licensing_status: reuse_license_and_permission_not_independently_verified
    content_version: live_web_page_reviewed_2026_08_23
    content_sha256: unavailable
    inclusion_decision: included_after_developer_review
    independent_content_review: pending
    next_scheduled_review: "2027-02-23"

