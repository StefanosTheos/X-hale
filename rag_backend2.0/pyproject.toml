[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hailey-backend"
version = "2.0.0"
description = "Hailey 2.0 — Agentic RAG chatbot backend for X-hale"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "groq>=0.11.0",
    "qdrant-client>=1.11.0",
    "appwrite>=7.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "duckduckgo-search>=6.3.0",
    "python-multipart>=0.0.12",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
    "anyio>=4.4.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
ingestion = [
    "sentence-transformers>=3.0.0",
    "langchain-text-splitters>=0.3.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.11.0",
    "httpx>=0.27.0",
]
reranker = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "deepeval>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
