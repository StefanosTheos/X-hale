name: Hailey readiness monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hailey-readiness-monitor
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Hailey dependencies
        env:
          HAILEY_API_URL: ${{ secrets.HAILEY_API_URL }}
        run: |
          set -euo pipefail
          test -n "$HAILEY_API_URL"

          response=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 15 \
            --retry-all-errors \
            "${HAILEY_API_URL%/}/ready")

          echo "$response" | jq .
          echo "$response" | jq -e '.status == "ready"' >/dev/null
