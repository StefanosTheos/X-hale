name: Benchmark Evaluation

on:
  schedule:
    - cron: '0 3 * * 1-6'  # Mon–Sat 03:00 UTC — 5% nightly sample
    - cron: '0 3 * * 0'    # Sunday 03:00 UTC — full sweep
  workflow_dispatch:
    inputs:
      sample:
        description: 'Sample fraction (1.0 = full, 0.05 = 5%)'
        default: '0.05'
      category:
        description: 'Run only this category (leave blank for all)'
        default: ''

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r finetune/eval/requirements-eval.txt

      - name: Determine sample fraction
        id: params
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            DAY=$(date -u +%u)   # 1=Mon … 7=Sun
            if [[ "$DAY" == "7" ]]; then
              echo "sample=1.0" >> "$GITHUB_OUTPUT"
            else
              echo "sample=0.05" >> "$GITHUB_OUTPUT"
            fi
            echo "category=" >> "$GITHUB_OUTPUT"
          else
            echo "sample=${{ github.event.inputs.sample || '0.05' }}" >> "$GITHUB_OUTPUT"
            echo "category=${{ github.event.inputs.category }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmark
        id: benchmark
        continue-on-error: true
        env:
          HAILEY_API_URL: ${{ secrets.HAILEY_API_URL }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_BENCHMARK_KEY: ${{ secrets.APPWRITE_BENCHMARK_KEY }}
          BENCHMARK_TEST_USER_ID: ${{ secrets.BENCHMARK_TEST_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS="--sample ${{ steps.params.outputs.sample }}"
          CAT="${{ steps.params.outputs.category }}"
          [[ -n "$CAT" ]] && ARGS="$ARGS --category $CAT"
          python finetune/eval/run_benchmark.py $ARGS \
            --output finetune/eval/results/run_${{ github.run_id }}_${{ github.run_attempt }}.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: finetune/eval/results/run_${{ github.run_id }}_${{ github.run_attempt }}.json
          retention-days: 365

      - name: Fail if benchmark did not pass
        if: always()
        run: |
          python -c "
          import json, sys
          d = json.load(open('finetune/eval/results/run_${{ github.run_id }}_${{ github.run_attempt }}.json'))
          cases = d['cases']
          evaluated = [c for c in cases if not c['error']]
          errored = [c for c in cases if c['error']]
          quality = round(100*sum(1 for c in evaluated if c['passed'])/len(evaluated)) if evaluated else 0
          err_rate = round(100*len(errored)/len(cases)) if cases else 0
          print(f'Quality: {quality}%  Errors: {err_rate}%')
          if quality < 80:
              print(f'FAIL — quality {quality}% below 80%'); sys.exit(1)
          if err_rate > 20:
              print(f'FAIL — error rate {err_rate}% above 20%'); sys.exit(1)
          print('PASS')
          "
