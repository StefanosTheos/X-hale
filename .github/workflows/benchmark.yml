name: Benchmark Evaluation

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Random sample fraction; use 1.0 for deterministic shard mode'
        default: '1.0'
      category:
        description: 'Run only this category (leave blank for all)'
        default: ''
      shard_count:
        description: 'Number of deterministic shards'
        default: '20'
      shard_index:
        description: 'Zero-based shard index'
        default: '0'
      resume_run_id:
        description: 'Prior run ID containing an incomplete artifact to resume'
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r finetune/eval/requirements-eval.txt

      - name: Determine execution parameters
        id: params
        run: |
          echo "sample=${{ github.event.inputs.sample || '1.0' }}" >> "$GITHUB_OUTPUT"
          echo "category=${{ github.event.inputs.category }}" >> "$GITHUB_OUTPUT"
          echo "shard_count=${{ github.event.inputs.shard_count || '20' }}" >> "$GITHUB_OUTPUT"
          echo "shard_index=${{ github.event.inputs.shard_index || '0' }}" >> "$GITHUB_OUTPUT"
          echo "resume_run_id=${{ github.event.inputs.resume_run_id }}" >> "$GITHUB_OUTPUT"

      - name: Download prior checkpoint
        if: steps.params.outputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ steps.params.outputs.resume_run_id }}
          path: finetune/eval/resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.params.outputs.resume_run_id }}

      - name: Run benchmark
        id: benchmark
        continue-on-error: true
        env:
          HAILEY_API_URL: ${{ secrets.HAILEY_API_URL }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_BENCHMARK_KEY: ${{ secrets.APPWRITE_BENCHMARK_KEY }}
          BENCHMARK_TEST_USER_ID: ${{ secrets.BENCHMARK_TEST_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BENCHMARK_JUDGE_PROVIDER: ${{ vars.BENCHMARK_JUDGE_PROVIDER || 'gemini' }}
          BENCHMARK_JUDGE_MODEL: ${{ vars.BENCHMARK_JUDGE_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          OUTPUT="finetune/eval/results/run_${{ github.run_id }}_${{ github.run_attempt }}.json"
          ARGS="--sample ${{ steps.params.outputs.sample }} --shard-count ${{ steps.params.outputs.shard_count }} --shard-index ${{ steps.params.outputs.shard_index }}"
          CAT="${{ steps.params.outputs.category }}"
          [[ -n "$CAT" ]] && ARGS="$ARGS --category $CAT"
          RESUME="${{ steps.params.outputs.resume_run_id }}"
          if [[ -n "$RESUME" ]]; then
            cp "$(find finetune/eval/resume -name '*.json' -print -quit)" "$OUTPUT"
            ARGS="$ARGS --resume"
          fi
          python finetune/eval/run_benchmark.py $ARGS --output "$OUTPUT"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: finetune/eval/results/run_${{ github.run_id }}_${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 365

      - name: Fail if benchmark did not pass
        if: always()
        run: |
          python -c "
          import json, sys
          d = json.load(open('finetune/eval/results/run_${{ github.run_id }}_${{ github.run_attempt }}.json'))
          if not d.get('complete'):
              print(f\"INCOMPLETE — {d.get('stop_reason')} ({len(d.get('cases', []))}/{d.get('selected_total')} cases)\"); sys.exit(1)
          cases = d['cases']
          evaluated = [c for c in cases if not c['error']]
          errored = [c for c in cases if c['error']]
          quality = round(100*sum(1 for c in evaluated if c['passed'])/len(evaluated)) if evaluated else 0
          err_rate = round(100*len(errored)/len(cases)) if cases else 0
          print(f'Quality: {quality}%  Errors: {err_rate}%')
          if quality < 80:
              print(f'FAIL — quality {quality}% below 80%'); sys.exit(1)
          if err_rate > 20:
              print(f'FAIL — error rate {err_rate}% above 20%'); sys.exit(1)
          print('PASS')
          "
